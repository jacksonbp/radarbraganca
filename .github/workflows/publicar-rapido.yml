# Publicação rápida do Radar Bragança.
# Quando um envio muda só páginas escritas à mão (site/natal, site/demandas…) e não mexe no robô,
# o site vai ao ar em 1–2 minutos, sem refazer a coleta na Câmara. A coleta diária das 4h17
# continua no atualizar.yml, que também roda quando o envio muda algo em coletor/.
name: Publicar rápido

on:
  push:
    branches: [main]
    paths-ignore:
      - "coletor/**"
      - ".github/workflows/atualizar.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar-rapido
  cancel-in-progress: true

jobs:
  empacotar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Sempre a versão mais nova do main (inclui os dados que o robô já salvou).
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publicar:
    needs: empacotar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # Aviso no Telegram. O robô manda só o número da rodada; a planilha confere no próprio GitHub
  # se deu certo ou falhou e só então avisa (ninguém consegue mandar aviso falso por esse caminho).
  avisar:
    needs: [empacotar, publicar]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Avisar no Telegram
        run: |
          curl -sS -L --max-time 90 -H "Content-Type: text/plain" \
            --data '{"formulario":"robo","rodada":"${{ github.run_id }}"}' \
            "https://script.google.com/macros/s/AKfycbx0kbVSCYo3pb3Xj8LdKBKomcxVt-quGMtMc9zs2XYX26IxU4zHliCuPp41OJla03UcGA/exec" || echo "Aviso não saiu; não muda nada no site"
