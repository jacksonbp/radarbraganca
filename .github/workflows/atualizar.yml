# Robô diário do Radar Bragança.
# Todo dia às 4h (horário de Brasília) ele coleta os dados de novo na Câmara
# e republica o site. Se a coleta vier incompleta ou estranha, o coletor para
# com erro, nada é publicado e o site fica com a última versão boa.
name: Atualizar dados e publicar

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 04:00 em Brasília
  workflow_dispatch:       # botão "Run workflow" para rodar na hora
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar dados na Câmara
        if: github.event_name != 'push'
        run: |
          pip install pillow
          python coletor/coletar.py
      - name: Guardar os dados novos no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "radar-robo"
          git config user.email "radar-robo@users.noreply.github.com"
          git add site/dados.js site/fotos
          git diff --cached --quiet || git commit -m "Dados atualizados em $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
