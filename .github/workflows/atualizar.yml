# Robô diário do Radar Bragança.
# Todo dia às 4h17 (horário de Brasília) ele coleta os dados de novo na Câmara
# e republica o site. Se a coleta vier incompleta ou estranha, o coletor para
# com erro, nada é publicado e o site fica com a última versão boa.
name: Atualizar dados e publicar

on:
  schedule:
    - cron: "17 7 * * *"  # 04:17 em Brasília; evita o início da hora
  workflow_dispatch:       # botão "Run workflow" para rodar na hora
  push:
    branches: [main]
    # Só refaz a coleta quando o robô muda. Páginas escritas à mão (jantar, Voz do Bairro…)
    # vão ao ar pelo publicar-rapido.yml em 1–2 minutos, sem esperar a Câmara.
    paths:
      - "coletor/**"
      - ".github/workflows/atualizar.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  coletar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      publicar: ${{ steps.guardar.outputs.publicar }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Coletar dados na Câmara
        run: |
          pip install pillow pypdf
          python coletor/coletar.py
          python coletor/prefeitura.py || echo "TCE-SP fora do ar; a página da Prefeitura fica com os dados de ontem"
          python coletor/paginas.py
      - name: Auditar propostas contra a tela oficial
        id: auditoria
        run: |
          rm -f coletor/auditoria.json
          python coletor/auditar.py --propostas
      - name: Guardar relatório da auditoria
        if: ${{ !cancelled() && (steps.auditoria.outcome == 'success' || steps.auditoria.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: auditoria-propostas
          path: coletor/auditoria.json
      # Se alguém enviou mudanças enquanto a coleta rodava (10+ minutos), o robô junta os dados
      # novos com elas em vez de desistir. Só não publica quando a junção dá conflito E já existe
      # uma rodada mais nova do robô na fila (ela refaz tudo com a versão nova).
      - name: Guardar os dados novos no repositório
        id: guardar
        run: |
          git config user.name "radar-robo"
          git config user.email "radar-robo@users.noreply.github.com"
          git add site coletor/cache_viagens.json coletor/cache_tce.json
          git diff --cached --quiet || git commit -m "Dados atualizados em $(date -u +%Y-%m-%d)"
          for tentativa in 1 2 3 4 5; do
            if git push origin HEAD:refs/heads/main; then
              echo "publicar=sim" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "O main mudou durante a coleta; juntando os dados com as mudanças novas (tentativa $tentativa)"
            git fetch origin main
            robo_novo=nao
            if git diff --name-only "$GITHUB_SHA" FETCH_HEAD -- coletor .github/workflows/atualizar.yml \
                 ':(exclude)coletor/cache_viagens.json' ':(exclude)coletor/cache_tce.json' | grep -q .; then
              robo_novo=sim
            fi
            if ! git rebase FETCH_HEAD; then
              git rebase --abort
              if [ "$robo_novo" = sim ]; then
                echo "::notice::Conflito com uma mudança no robô; a rodada mais nova (já na fila) publica tudo."
                echo "publicar=nao" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::Conflito entre os dados novos e uma mudança feita à mão; precisa olhar."
              exit 1
            fi
            sleep $((tentativa * 5))
          done
          echo "::error::Não consegui salvar depois de 5 tentativas."
          exit 1
      - name: Conferir revisão antes de publicar
        if: steps.guardar.outputs.publicar == 'sim'
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - uses: actions/configure-pages@v6
        if: steps.guardar.outputs.publicar == 'sim'
      - uses: actions/upload-pages-artifact@v5
        if: steps.guardar.outputs.publicar == 'sim'
        with:
          path: site

  publicar:
    needs: coletar
    if: needs.coletar.outputs.publicar == 'sim'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # Aviso no Telegram. O robô manda só o número da rodada; a planilha confere no próprio GitHub
  # se deu certo ou falhou e só então avisa (ninguém consegue mandar aviso falso por esse caminho).
  avisar:
    needs: [coletar, publicar]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Avisar no Telegram
        run: |
          curl -sS -L --max-time 90 -H "Content-Type: text/plain" \
            --data '{"formulario":"robo","rodada":"${{ github.run_id }}"}' \
            "https://script.google.com/macros/s/AKfycbx0kbVSCYo3pb3Xj8LdKBKomcxVt-quGMtMc9zs2XYX26IxU4zHliCuPp41OJla03UcGA/exec" || echo "Aviso não saiu; não muda nada no site"
