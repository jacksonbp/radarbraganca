# Robô diário do Radar Bragança.
# Todo dia às 4h17 (horário de Brasília) ele coleta os dados de novo na Câmara
# e republica o site. Se a coleta vier incompleta ou estranha, o coletor para
# com erro, nada é publicado e o site fica com a última versão boa.
name: Atualizar dados e publicar

on:
  schedule:
    - cron: "17 7 * * *"  # 04:17 em Brasília; evita o início da hora
  workflow_dispatch:       # botão "Run workflow" para rodar na hora
  push:
    branches: [main]
    # Só refaz a coleta quando o robô muda. Páginas escritas à mão (jantar, Voz do Bairro…)
    # vão ao ar pelo publicar-rapido.yml em 1–2 minutos, sem esperar a Câmara.
    paths:
      - "coletor/**"
      - ".github/workflows/atualizar.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  coletar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Coletar dados na Câmara
        run: |
          pip install pillow pypdf
          python coletor/coletar.py
          python coletor/prefeitura.py || echo "TCE-SP fora do ar; a página da Prefeitura fica com os dados de ontem"
          python coletor/paginas.py
      - name: Auditar propostas contra a tela oficial
        id: auditoria
        run: |
          rm -f coletor/auditoria.json
          python coletor/auditar.py --propostas
      - name: Guardar relatório da auditoria
        if: ${{ !cancelled() && (steps.auditoria.outcome == 'success' || steps.auditoria.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: auditoria-propostas
          path: coletor/auditoria.json
      - name: Guardar os dados novos no repositório
        run: |
          git config user.name "radar-robo"
          git config user.email "radar-robo@users.noreply.github.com"
          git add site coletor/cache_viagens.json coletor/cache_tce.json
          git diff --cached --quiet || git commit -m "Dados atualizados em $(date -u +%Y-%m-%d)"
          git push origin HEAD:refs/heads/main
      - name: Conferir revisão antes de publicar
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
